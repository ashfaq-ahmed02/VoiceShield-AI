name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------
  # Backend: install, syntax-check, and smoke-test the Flask API
  # ---------------------------------------------------------------------
  backend-ci:
    name: Backend (Flask)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile check
        run: python -m py_compile app.py

      - name: Lint (flake8)
        run: |
          pip install flake8
          flake8 app.py --max-line-length=120 --extend-ignore=E203,W503

      - name: Run test suite
        run: |
          pip install pytest
          if [ -d tests ]; then pytest -q; else echo "No tests directory yet — skipping"; fi

      - name: Smoke-test the API
        run: |
          python app.py &
          SERVER_PID=$!
          sleep 3
          curl -sf http://127.0.0.1:5000/api/health
          curl -sf -X POST http://127.0.0.1:5000/api/analyze \
            -H "Content-Type: application/json" \
            -d '{"call_id":"CI-TEST","scenario":"safe"}'
          curl -sf http://127.0.0.1:5000/api/threats
          curl -sf http://127.0.0.1:5000/api/analytics
          kill $SERVER_PID

  # ---------------------------------------------------------------------
  # Frontend: syntax-check the static HTML / CSS / JS
  # ---------------------------------------------------------------------
  frontend-ci:
    name: Frontend (HTML/CSS/JS)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate JavaScript syntax
        run: node --check script.js

      - name: Lint HTML
        run: |
          npm install -g htmlhint
          htmlhint index.html || true

      - name: Lint CSS
        run: |
          npm install -g stylelint stylelint-config-standard
          echo '{ "extends": "stylelint-config-standard", "rules": { "no-descending-specificity": null } }' > .stylelintrc.json
          npx stylelint "style.css" || true

  # ---------------------------------------------------------------------
  # Deploy the backend: build a Docker image and push it to GitHub
  # Container Registry (ghcr.io) — no third-party account needed, auth
  # is via the built-in GITHUB_TOKEN.
  # ---------------------------------------------------------------------
  deploy-backend:
    name: Deploy backend to GHCR
    needs: [backend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/voiceshield-backend
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: backend
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Backend image published :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "\`ghcr.io/${{ github.repository }}/voiceshield-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull and run it with:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "docker pull ghcr.io/${{ github.repository }}/voiceshield-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo "docker run -p 5000:5000 ghcr.io/${{ github.repository }}/voiceshield-backend:latest" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # ---------------------------------------------------------------------
  # Deploy the static frontend to GitHub Pages (main branch only)
  # ---------------------------------------------------------------------
  deploy-frontend:
    name: Deploy frontend to GitHub Pages
    needs: [backend-ci, frontend-ci]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare site directory
        run: |
          mkdir -p _site
          cp index.html style.css script.js _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4